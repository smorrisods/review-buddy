[workspace]
resolver = "2"
members = [
    "crates/rb-core",
    "crates/rb-github",
    "crates/rb-gitlab",
    "crates/rb-paths",
    "crates/rb-platform",
    "crates/rb-store",
    "crates/rb-theme",
    "crates/rb-diff",
    "crates/review-buddy",
]
default-members = ["crates/review-buddy"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["Scott Morris"]
repository = "https://github.com/smorrisods/review-buddy"
homepage = "https://github.com/smorrisods/review-buddy"
documentation = "https://github.com/smorrisods/review-buddy#readme"
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
insta = "1"
keyring = { version = "3.6", default-features = false }
portable-pty = "0.9"
predicates = "3"
proptest = "1"
ratatui = "0.30"
rb-core = { path = "crates/rb-core" }
rb-diff = { path = "crates/rb-diff" }
rb-github = { path = "crates/rb-github" }
rb-gitlab = { path = "crates/rb-gitlab" }
rb-paths = { path = "crates/rb-paths" }
rb-platform = { path = "crates/rb-platform" }
rb-store = { path = "crates/rb-store" }
rb-theme = { path = "crates/rb-theme" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
toml_edit = { version = "0.22", features = ["parse", "display"] }
unicode-width = "0.2"
url = { version = "2", features = ["serde"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
