<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Review Buddy</title>
  <desc id="hero-desc">Every pull and merge request, in one quiet queue. A dark Liminal HQ banner with a slowly drifting glow and an animated review queue.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080c"/>
      <stop offset="100%" stop-color="#14101e"/>
    </linearGradient>

    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffaa40"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="queue-clip">
      <rect x="720" y="52" width="420" height="216" rx="10"/>
    </clipPath>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- Drifting ambient glows -->
  <g opacity="0.10">
    <circle cx="160" cy="280" r="180" fill="#ffaa40">
      <animate attributeName="cx" values="160;240;160" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="40" r="150" fill="#a78bfa">
      <animate attributeName="cy" values="40;90;40" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="160" r="170" fill="#f43f5e">
      <animate attributeName="r" values="170;195;170" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Wordmark -->
  <g font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace">
    <text x="64" y="150" font-size="64" font-weight="700" fill="url(#brand)" filter="url(#text-glow)">review buddy</text>
    <text x="66" y="192" font-size="20" fill="#b4bfce">every pull and merge request,</text>
    <text x="66" y="220" font-size="20" fill="#b4bfce">in one quiet queue.</text>
    <text x="66" y="266" font-size="14" fill="#7c8796">GitHub · GitLab · Rust · ratatui</text>
    <rect x="352" y="206" width="11" height="18" fill="#ffaa40">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Queue panel -->
  <rect x="720" y="52" width="420" height="216" rx="10" fill="#111116" stroke="#2a2d36"/>
  <g clip-path="url(#queue-clip)" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="14">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -144" dur="12s" repeatCount="indefinite"/>
      <!-- Each row is 48px tall; the list repeats after three rows (144px) for a seamless loop -->
      <g transform="translate(0 0)">
        <rect x="736" y="64" width="388" height="40" rx="6" fill="#ffaa40" fill-opacity="0.12"/>
        <rect x="736" y="64" width="3" height="40" fill="#ffaa40"/>
        <circle cx="758" cy="84" r="5" fill="#2ec66a"/>
        <text x="776" y="80" fill="#ffffff">Add retry to sync worker</text>
        <text x="776" y="97" fill="#7c8796" font-size="12">gh · acme/api · #482</text>
        <text x="1108" y="89" fill="#60a5fa" font-size="12" text-anchor="end">review</text>
      </g>
      <g transform="translate(0 48)">
        <circle cx="758" cy="84" r="5" fill="#fbbf24">
          <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <text x="776" y="80" fill="#e0e0e0">Fix flaky diff gutter</text>
        <text x="776" y="97" fill="#7c8796" font-size="12">gl · infra/tools · !91</text>
        <text x="1108" y="89" fill="#a78bfa" font-size="12" text-anchor="end">review</text>
      </g>
      <g transform="translate(0 96)">
        <circle cx="758" cy="84" r="5" fill="#f43f5e"/>
        <text x="776" y="80" fill="#e0e0e0">Rework theme loader</text>
        <text x="776" y="97" fill="#7c8796" font-size="12">gh · acme/web · #477</text>
        <text x="1108" y="89" fill="#60a5fa" font-size="12" text-anchor="end">mine</text>
      </g>
      <g transform="translate(0 144)">
        <rect x="736" y="64" width="388" height="40" rx="6" fill="#ffaa40" fill-opacity="0.12"/>
        <rect x="736" y="64" width="3" height="40" fill="#ffaa40"/>
        <circle cx="758" cy="84" r="5" fill="#2ec66a"/>
        <text x="776" y="80" fill="#ffffff">Add retry to sync worker</text>
        <text x="776" y="97" fill="#7c8796" font-size="12">gh · acme/api · #482</text>
        <text x="1108" y="89" fill="#60a5fa" font-size="12" text-anchor="end">review</text>
      </g>
      <g transform="translate(0 192)">
        <circle cx="758" cy="84" r="5" fill="#fbbf24"/>
        <text x="776" y="80" fill="#e0e0e0">Fix flaky diff gutter</text>
        <text x="776" y="97" fill="#7c8796" font-size="12">gl · infra/tools · !91</text>
        <text x="1108" y="89" fill="#a78bfa" font-size="12" text-anchor="end">review</text>
      </g>
      <g transform="translate(0 240)">
        <circle cx="758" cy="84" r="5" fill="#f43f5e"/>
        <text x="776" y="80" fill="#e0e0e0">Rework theme loader</text>
        <text x="776" y="97" fill="#7c8796" font-size="12">gh · acme/web · #477</text>
        <text x="1108" y="89" fill="#60a5fa" font-size="12" text-anchor="end">mine</text>
      </g>
    </g>
  </g>

  <!-- Brand underline sweep -->
  <rect x="64" y="298" width="1072" height="2" rx="1" fill="url(#brand)" opacity="0.5"/>
  <rect x="64" y="297" width="120" height="4" rx="2" fill="#ffffff" opacity="0.7">
    <animate attributeName="x" values="64;1016;64" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
