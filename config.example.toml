# Review Buddy — example config
# Copy to $XDG_CONFIG_HOME/review-buddy/config.toml (default ~/.config/review-buddy/config.toml, macOS too).
# Split sources into $XDG_CONFIG_HOME/review-buddy/config.d/*.toml if you like; they merge in lexical order.
# System defaults may live in $XDG_CONFIG_DIRS/review-buddy/config.toml (default /etc/xdg/…).
# Tokens are never stored here; they live in your OS keyring.

[ui]
theme = "liminal-hq"        # liminal-hq | afterglow-dark | afterglow-light | any file in themes/
layout = "panes"            # panes | split | queue   (L cycles)
sources = "auto"            # auto | left | top  (S cycles for the session; auto = pane at 130+ columns)
detail = "auto"             # auto | open | closed  (p toggles for the session)
detail_position = "auto"    # auto | right | left | top | bottom  (P rotates it: auto, bottom, left, top, right; REVIEW_BUDDY_DETAIL_POSITION for one run; auto = right at 110+ columns, else below the Queue)
queue_width = 48            # columns, or a percentage like "60%" (side by side; < > or dragging the seam change it for the session, W saves it; omit for automatic)
queue_height = "55%"        # columns/rows as above, for when Detail is above or below the Queue
jax = true                  # J toggles
reduced_motion = false
images = "auto"            # auto | off | halfblocks | forge-only  (pictures in descriptions; forge-only fetches only from your forge's own hosts; REVIEW_BUDDY_IMAGES for one run)
unicode = true
date_locale = "en-CA"        # parsed, not applied yet (banner times are UTC for now)
colour_depth = "auto"       # auto | truecolor | 256 | 16
background = "theme"        # theme | yes | no  (B cycles for the session; REVIEW_BUDDY_BACKGROUND for one run)
                            # theme = paint what the theme sets (afterglow does, liminal-hq and dusk don't); yes = always paint; no = never
mouse = true
remember_layout = true      # remember P, S, p, B and dragged sizes between runs in the state dir's session.toml; false = neither read nor written
drafts = "local"            # local = keep unsent review comments across restarts in the state dir's drafts/ folder; off = memory only, nothing written

# Per-theme background, beating ui.background for that theme.
# [ui.theme_background]
# dusk = "yes"
# afterglow-light = "no"

# The terminal pane: t opens a shell (or an assistant tool) next to the change.
# [ui.terminal]
# command = []              # program and arguments; empty runs $SHELL (%COMSPEC% on Windows). e.g. ["claude"]
# escape = "ctrl-\\"        # press this, then esc, to give the keyboard back to the app (esc esc also works)
# position = "auto"         # auto | right | left | top | bottom (ctrl-\\ then p cycles it)
# size = "40%"              # columns or rows, or a percentage; auto when unset
# scrollback = 10000
# start = "ask"             # ask | worktree | current
# [ui.terminal.checkouts]   # local clones to make worktrees from, by repository
# "owner/name" = "~/src/name"

[review]
merge_method = "squash"     # merge | squash | rebase
confirm_merge = true        # always defaults to "No, not yet"
confirm_post_now = true     # preview a comment or reply before ctrl-enter posts it on its own (approving always previews)
delete_branch_on_merge = true
mark_viewed_on_open = true
request_changes_needs_summary = true

[diff]
view = "unified"            # unified | side-by-side   (v toggles)
auto_side_by_side = true
side_by_side_min_cols = 160
context_lines = 3
ignore_whitespace = false
syntax_highlight = true     # parsed, not applied yet (the diff is always highlighted)
tab_width = 4

[refresh]
interval = "5m"             # pull only, while open. "off" = manual (r)
on_focus = true
max_concurrency_per_host = 4   # requests in flight at once to one host

[triage]
noise_authors = ["renovate[bot]", "dependabot[bot]", "release-please[bot]"]
bucket_limit = 20
show = ["reviewing", "assigned", "authored"]   # add "drafts" to see drafts
stale_after = "14d"
noise_collapsed = true      # parsed, not applied yet (Noise is always one collapsed row)

# Your own bucket rules, tried before the built-in ones; the first match wins. Planned for v0.4: parsed, not run yet.
# [[triage.rule]]
# repo = "platform/infra"
# path = "**/*.tf"
# bucket = "wait"           # wait | look | later | noise

[checkout]
root = "~/src/{repo}"
use_worktree_if_dirty = true
clone_if_missing = "ask"

# Sources: tab keys 2–9 follow this order (1 is always All).

[[source]]
name = "liminal-hq"
kind = "github"
host = "github.com"
auth = "cli"                # reuse `gh` sign-in
scope = { orgs = ["liminal-hq"] }
tag_colour = "github"

[[source]]
name = "smorris"
kind = "github"
host = "github.com"
auth = "cli"
scope = { user = true }
tag_colour = "github"

[[source]]
name = "platform"
kind = "gitlab"
host = "gitlab.work.ca"
auth = "token"              # stored in keyring as review-buddy/gitlab.work.ca
scope = { groups = ["platform", "infra"] }
include_drafts = false      # parsed, not applied yet (drafts follow triage.show)
tag_colour = "gitlab"
# in_all = true             # false leaves the source out of the All view
# enabled = true
# hide_repos = ["platform/legacy-*"]   # projects the queue leaves out; a trailing * covers a prefix
# api_url = "https://example.com/gitlab/api/v4"   # only for a path prefix, plain http or another port
# token_command = "pass show gitlab/work"          # used when auth = "command"

[[source]]
name = "gitlab.com"
kind = "gitlab"
host = "gitlab.com"
auth = "cli"                # reuse `glab` sign-in
tag_colour = "gitlab"

